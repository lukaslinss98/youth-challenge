spring.application.name=wearables

spring.datasource.url=jdbc:postgresql://localhost:5432/wearables
spring.datasource.username=wearables
spring.datasource.password=wearables

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validateOnMigrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

junction.api.key=${JUNCTION_API_KEY}
junction.webhook.secret=${JUNCTION_WEBHOOK_SECRET}

vitals.sync.lookback-days=180

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

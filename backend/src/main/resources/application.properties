spring.application.name=wearables

spring.datasource.url=jdbc:postgresql://localhost:5432/wearables
spring.datasource.username=wearables
spring.datasource.password=wearables

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validateOnMigrate=false

jwt.secret=dev-only-secret-key-please-rotate-before-any-real-deployment-32b
jwt.expiration-ms=86400000

junction.api.key=${JUNCTION_API_KEY}
